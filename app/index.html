<!doctype html>
<html lang="en-GB" data-brand="neutral">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8F0FA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clear Sight">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Clear Sight Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --fs:1;
  --blue:#005EB8; --blue-dark:#003D78; --blue-soft:#E8F0FA; --blue-line:#C9DAEE;
  --ink:#0B1F33; --muted:#4C6272; --line:#D8E1EA; --card:#FFFFFF; --page:#F1F5FA;
  --green-soft:#E6F3EC; --green:#1E6B3A; --amber-soft:#FFF4D6; --amber:#7A5300; --red:#B3261E; --red-soft:#FCEDEC;
  --r:16px; --r-sm:10px;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html,body { margin:0; background:#DCE6F2; color:var(--ink); font:calc(16px * var(--fs))/1.5 'Plus Jakarta Sans', system-ui, sans-serif; }
a { color:var(--blue); } a:hover { color:var(--blue-dark); }
button, input, select, textarea { font:inherit; color:inherit; }
:focus-visible { outline:3px solid #FFB81C; outline-offset:2px; }

.phone { max-width:420px; min-height:100vh; min-height:100dvh; margin:0 auto; background:var(--page); display:flex; flex-direction:column; position:relative; overflow-x:clip; }
main { flex:1; padding:calc(16px + env(safe-area-inset-top)) 16px 104px; }

/* Type */
h1 { font-size:calc(24px * var(--fs)); line-height:1.2; margin:0 0 4px; font-weight:800; letter-spacing:-.4px; }
h2 { font-size:calc(17px * var(--fs)); margin:24px 0 10px; font-weight:800; display:flex; flex-wrap:wrap; gap:2px 12px; justify-content:space-between; align-items:baseline; }
h2 .more { font-size:calc(14px * var(--fs)); font-weight:700; text-decoration:none; }
h3 { font-size:calc(16px * var(--fs)); margin:0 0 6px; font-weight:800; }
p { margin:0 0 8px; }
.lede, .sub { color:var(--muted); font-size:calc(15px * var(--fs)); }
.hint { font-size:calc(14px * var(--fs)); color:var(--muted); margin:0 0 8px; }
.small { font-size:calc(13px * var(--fs)); color:var(--muted); }

.nhs { display:inline-block; background:var(--blue); color:#fff; font:italic 800 calc(16px * var(--fs))/1 Arial, sans-serif; padding:4px 6px; letter-spacing:-.4px; }
.concept { font-size:calc(12.5px * var(--fs)); color:var(--muted); margin-left:auto; }
.nhs.big { font-size:calc(24px * var(--fs)); padding:6px 9px; }
.mark { display:inline-flex; align-items:center; justify-content:center; }
.mark svg { display:block; }
.eyebrow { margin:12px 0 0; font-size:calc(13px * var(--fs)); font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--blue); }
.eyepill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px 3px 6px; border-radius:999px; background:#fff; border:1px solid var(--line); font-size:calc(13px * var(--fs)); font-weight:700; color:var(--blue-dark); }
.pagehead { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.avatar { margin-left:auto; width:40px; height:40px; border-radius:50%; background:var(--blue); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-weight:800; text-decoration:none; flex:none; }
.avatar:hover { background:var(--blue-dark); color:#fff; }
.avatar.sm { width:28px; height:28px; font-size:calc(14px * var(--fs)); margin:0 8px 0 0; vertical-align:middle; }
.avatar.lg { width:56px; height:56px; font-size:calc(22px * var(--fs)); margin:0; }
.profilehead { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
details.card summary { cursor:pointer; list-style:none; min-height:28px; } details.card summary::-webkit-details-marker { display:none; }
.linkrow .avatar.sm + * { display:inline; }

/* Cards */
.card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin-bottom:10px; }
.card.green { background:var(--green-soft); border-color:#CBE5D5; }
.card.tint { background:var(--blue-soft); border-color:var(--blue-line); }
a.card { display:block; color:inherit; text-decoration:none; }
a.card:hover { border-color:var(--blue); }
a.card h3::after { content:' ›'; color:var(--blue); }
.cards { display:flex; flex-direction:column; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
.grid2 .card { margin:0; padding:12px; }
.grid2 h3 { font-size:calc(15px * var(--fs)); margin:0 0 2px; }

.tag { display:inline-block; font-size:calc(12.5px * var(--fs)); font-weight:700; padding:2px 8px; border-radius:999px; background:var(--blue-soft); color:var(--blue-dark); margin:0 4px 6px 0; }
.tag.overdue { background:var(--red-soft); color:var(--red); } .tag.due { background:var(--amber-soft); color:var(--amber); }
.tag.ok { background:var(--green-soft); color:var(--green); } .tag.free { background:var(--green-soft); color:var(--green); }
.tag.neutral { background:#EEF1F4; color:var(--muted); }
.because { font-size:calc(13px * var(--fs)); font-weight:600; color:var(--blue-dark); }

.bar { height:8px; background:rgba(11,31,51,.1); border-radius:999px; margin-top:10px; overflow:hidden; }
.bar span { display:block; height:100%; background:var(--green); border-radius:999px; transition:width .3s; }

/* Buttons */
.btn { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:10px 20px; border:0; border-radius:999px; background:var(--blue); color:#fff; font-weight:700; cursor:pointer; text-decoration:none; text-align:center; }
.btn:hover { background:var(--blue-dark); color:#fff; }
.btn.secondary { background:#fff; color:var(--blue); box-shadow:inset 0 0 0 1.5px var(--blue); }
.btn.secondary:hover { background:var(--blue-soft); color:var(--blue-dark); }
.btn.danger { background:#fff; color:var(--red); box-shadow:inset 0 0 0 1.5px var(--red); }
.btn.wide { width:100%; }
.navrow { display:flex; gap:10px; margin-top:16px; } .navrow .btn { flex:1; }
.back { display:inline-flex; align-items:center; min-height:36px; padding:4px 14px; border:1px solid var(--line); border-radius:999px; background:#fff; font-size:calc(14px * var(--fs)); font-weight:700; text-decoration:none; color:var(--ink); margin-bottom:12px; }
.linkrow { display:flex; justify-content:space-between; align-items:center; gap:8px; min-height:52px; padding:12px 14px; background:#fff; border:1px solid var(--line); border-radius:var(--r-sm); margin-bottom:8px; font-weight:700; text-decoration:none; color:var(--blue); }
.linkrow:hover { border-color:var(--blue); }
.linkrow .small { display:block; font-weight:500; }
.linkrow::after { content:'↗'; color:var(--muted); }
.linkrow.internal::after { content:'›'; font-size:calc(20px * var(--fs)); }

/* Numbered steps */
ol.steps { list-style:none; counter-reset:s; padding:0; margin:8px 0 0; }
ol.steps li { counter-increment:s; display:flex; gap:12px; align-items:flex-start; padding:6px 0; font-size:calc(15px * var(--fs)); }
ol.steps li::before { content:counter(s); font-weight:800; font-size:calc(13px * var(--fs)); background:var(--blue-soft); color:var(--blue); width:24px; height:24px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; flex:none; }
ul.plain { padding-left:18px; margin:0; } ul.plain li { margin-bottom:4px; font-size:calc(15px * var(--fs)); }

/* Hero (welcome) */
.hero { margin:-16px -16px 0; background:var(--blue-soft); padding:20px 16px 0; }
.hero h1 { font-size:calc(32px * var(--fs)); color:var(--ink); margin-top:4px; }
.hero > svg { display:block; width:calc(100% + 32px); height:200px; margin:4px -16px 0; }
.hero::after { content:''; display:block; height:6px; background:var(--blue); margin:0 -16px; }
.sheet { background:#fff; border-radius:24px 24px 0 0; margin:-16px -16px -104px; padding:20px 16px 120px; position:relative; min-height:55vh; }

/* Banner */
.banner { border-radius:var(--r); border:2px solid var(--red); background:var(--red-soft); padding:12px 14px; margin-bottom:12px; }
.banner strong { color:var(--red); display:block; font-size:calc(17px * var(--fs)); }
.banner summary { cursor:pointer; font-weight:700; font-size:calc(14px * var(--fs)); }

/* Form */
.progress { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; flex:1; }
.progress span { height:6px; border-radius:999px; background:var(--blue-line); } .progress span.on { background:var(--blue); }
.stepbar { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
.stepbar .back { margin:0; }
fieldset { border:1px solid var(--line); border-radius:var(--r); background:#fff; margin:0 0 12px; padding:6px 14px 8px; }
legend { font-weight:800; padding:0 4px; float:left; width:100%; margin:8px 0 4px; }
legend + * { clear:both; }
label.opt { display:flex; align-items:center; gap:12px; min-height:48px; border-top:1px solid #EDF1F5; cursor:pointer; font-size:calc(15px * var(--fs)); }
label.opt input { width:20px; height:20px; accent-color:var(--blue); flex:none; margin:0; }
.field { display:block; margin-bottom:12px; } .field > span { display:block; font-weight:800; margin-bottom:6px; }
input[type=number], input[type=text], input[type=date], select, textarea { width:100%; min-height:48px; padding:10px 12px; border:1.5px solid #A9BACB; border-radius:var(--r-sm); background:#fff; }
input:focus, select:focus, textarea:focus { border-color:var(--blue); outline:none; box-shadow:0 0 0 3px rgba(0,94,184,.2); }
.err { color:var(--red); font-weight:700; font-size:calc(14px * var(--fs)); }
.sticky { position:sticky; bottom:0; padding:12px 0 4px; background:linear-gradient(transparent, var(--page) 30%); }

/* Tables (answers, rules) */
table { width:100%; border-collapse:collapse; }
.kv td, .kv th { text-align:left; padding:10px 0; border-bottom:1px solid #EDF1F5; vertical-align:top; font-size:calc(15px * var(--fs)); }
.kv th { width:42%; color:var(--muted); font-weight:600; padding-right:8px; }
.kv tr:last-child td, .kv tr:last-child th { border-bottom:0; }

/* Segmented */
.seg { display:grid; grid-template-columns:1fr 1fr; background:#E3EAF2; border-radius:999px; padding:4px; margin:8px 0 14px; }
.seg a { text-align:center; padding:8px; border-radius:999px; text-decoration:none; color:var(--muted); font-weight:700; font-size:calc(15px * var(--fs)); }
.seg a[aria-selected=true] { background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(11,31,51,.12); }

/* Timeline */
.tl { list-style:none; margin:0; padding:0 0 0 18px; border-left:2px solid var(--blue-line); }
.tl li { position:relative; padding:0 0 14px 8px; font-size:calc(15px * var(--fs)); }
.tl li::before { content:''; position:absolute; left:-25px; top:5px; width:12px; height:12px; border-radius:50%; background:var(--blue); box-shadow:0 0 0 3px var(--page); }
.tl .small { display:block; }

/* Sources */
.src { font-size:calc(14px * var(--fs)); padding-left:20px; margin:0; } .src li { margin-bottom:6px; }
.src .org { font-size:calc(12.5px * var(--fs)); font-weight:700; color:var(--muted); display:block; text-transform:uppercase; letter-spacing:.04em; }
.foot { font-size:calc(12.5px * var(--fs)); color:var(--muted); margin-top:24px; }

/* Tabs */
nav.tabs { position:absolute; bottom:0; left:0; right:0; display:grid; grid-template-columns:repeat(5,1fr); gap:2px; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); background:#fff; border-top:1px solid var(--line); z-index:4; }
nav.tabs a { text-align:center; padding:10px 2px; text-decoration:none; color:var(--muted); font-weight:700; font-size:calc(13px * var(--fs)); border-radius:999px; }
nav.tabs a[aria-current=page] { background:var(--blue-soft); color:var(--blue-dark); }
@media (max-width:899px){ nav.tabs { position:fixed; max-width:420px; margin:0 auto; } }

/* Assistant */
.ask { position:absolute; right:16px; bottom:76px; z-index:5; min-height:48px; padding:10px 18px; background:var(--ink); color:#fff; border:0; border-radius:999px; font-weight:800; cursor:pointer; box-shadow:0 6px 16px rgba(11,31,51,.25); }
.ask.noTabs { bottom:84px; }
@media (max-width:899px){ .ask { position:fixed; right:max(16px, calc(50% - 210px + 16px)); } }
.chat { position:absolute; inset:auto 0 0 0; height:75%; z-index:6; background:#fff; border-radius:24px 24px 0 0; box-shadow:0 -8px 30px rgba(11,31,51,.2); display:flex; flex-direction:column; overflow:hidden; }
@media (max-width:899px){ .chat { position:fixed; max-width:420px; margin:0 auto; } }
.chat header { display:flex; align-items:center; gap:8px; padding:14px 16px; border-bottom:1px solid var(--line); }
.chat header strong { flex:1; } .chat header small { display:block; font-weight:500; color:var(--muted); font-size:calc(13px * var(--fs)); }
.chat .log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; background:var(--page); }
.msg { max-width:88%; padding:10px 14px; border-radius:16px; font-size:calc(15px * var(--fs)); }
.msg.me { align-self:flex-end; background:var(--blue); color:#fff; border-bottom-right-radius:4px; }
.msg.bot { align-self:flex-start; background:#fff; border:1px solid var(--line); border-bottom-left-radius:4px; }
.msg.emergency, .msg.urgent { border:2px solid var(--red); background:var(--red-soft); }
.msg .src { margin:8px 0 0; }
.msg .go { margin-top:8px; min-height:36px; padding:6px 14px; font-size:calc(14px * var(--fs)); }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.chips button { border:1.5px solid var(--blue); color:var(--blue); background:#fff; padding:6px 12px; font-size:calc(14px * var(--fs)); font-weight:600; cursor:pointer; min-height:36px; border-radius:999px; }
.chat form { display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line); }
.chat form input { flex:1; border-radius:999px; }
.chat form button { border:0; background:var(--blue); color:#fff; padding:0 18px; font-weight:700; cursor:pointer; border-radius:999px; }
.iconbtn { border:1px solid var(--line); background:#fff; width:40px; height:40px; border-radius:50%; cursor:pointer; font-weight:700; flex:none; }

/* Voice */
.voicebar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:10px 0 0; }
.chipbtn { display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--ink); font-size:calc(14px * var(--fs)); font-weight:700; cursor:pointer; }
.chipbtn[aria-pressed=true] { background:var(--blue-soft); border-color:var(--blue-line); color:var(--blue-dark); }
.listenpage { margin:4px 0 10px; }
.vq { float:right; display:inline-flex; gap:6px; margin-left:8px; }
legend .vq, .field > span .vq { position:relative; top:-2px; }
.iconbtn.sm { width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; color:var(--blue); }
.iconbtn.mic.listening { background:var(--blue); color:#fff; border-color:var(--blue); animation:pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow:0 0 0 6px rgba(0,94,184,.2); } }
.vstatus { clear:both; margin:6px 0 4px; font-size:calc(14px * var(--fs)); font-weight:600; color:var(--blue-dark); background:var(--blue-soft); border-radius:10px; padding:8px 10px; }
.vstatus.error { color:#7A2E00; background:var(--amber-soft); }
.vstatus .donebtn { display:inline-flex; align-items:center; justify-content:center; min-height:44px; min-width:88px; margin-left:10px; padding:6px 18px; border:0; border-radius:999px; background:var(--blue); color:#fff; font-weight:800; font-size:calc(15px * var(--fs)); cursor:pointer; vertical-align:middle; }
.vstatus .donebtn:disabled { background:var(--muted); cursor:default; }
.chat form .iconbtn.mic { width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; color:var(--blue); }

/* Attachments */
.filepick { display:flex; align-items:center; gap:10px; flex-wrap:wrap; cursor:pointer; }
.filepick input { position:absolute; width:1px; height:1px; opacity:0; }
.filepick:focus-within .btn { outline:3px solid #FFB81C; outline-offset:2px; }
.attach { display:flex; flex-direction:column; gap:4px; margin-top:8px; text-decoration:none; }
.attach img { width:100%; max-width:220px; max-height:160px; object-fit:cover; border-radius:10px; border:1px solid var(--line); }

/* Prescriptions */
.scanbox { background:var(--blue-soft); border-radius:var(--r-sm); padding:10px 12px; margin-bottom:12px; }
.scanbox .scanstatus { margin:6px 0 0; }
#addRx input.checkme, #step input.checkme, .rxgrid input.checkme { border-color:#C98A00; background:var(--amber-soft); box-shadow:0 0 0 3px rgba(201,138,0,.25); }
.btn svg { margin-right:6px; flex:none; }
.seg.three { grid-template-columns:repeat(3, 1fr); }
.rxgrid { display:grid; grid-template-columns:48px repeat(3, 1fr); gap:6px; align-items:center; font-size:calc(14px * var(--fs)); }
.rxgrid b { font-weight:700; color:var(--muted); } .rxgrid input { min-height:44px; padding:8px; }
.kv.rx td, .kv.rx th { padding:6px 0; } .kv.rx td { font-variant-numeric:tabular-nums; font-weight:600; }

/* Nearby places & notices */
.btn.sm { min-height:38px; padding:6px 14px; font-size:calc(14px * var(--fs)); }
.place h3 { margin:0; } .placehead { display:flex; justify-content:space-between; gap:8px; align-items:baseline; margin-bottom:4px; }
.placeacts { display:flex; flex-wrap:wrap; gap:6px; }
.notice { border-radius:var(--r); background:var(--amber-soft); border:1px solid #F1DDA4; padding:12px 14px; margin:12px 0; font-size:calc(15px * var(--fs)); }
.notice strong { display:block; margin-bottom:4px; }
.notice.emergency { background:#FFF1EF; border-color:#F3C4BE; }
.notice summary { cursor:pointer; font-weight:700; font-size:calc(14px * var(--fs)); }

/* Opening animation: eye opens, title fades in, then the app */
#splash { position:fixed; inset:0; z-index:50; background:var(--page); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; animation:splashOut .45s 1.9s ease forwards; }
#splash svg { width:132px; height:80px; }
#splash .lid { transform-box:fill-box; transform-origin:center; animation:eyeOpen .7s .35s cubic-bezier(.2,.7,.3,1) both; }
#splash .title { font-weight:800; font-size:calc(22px * var(--fs)); letter-spacing:-.3px; color:var(--ink); animation:fadeUp .5s 1s ease both; }
#splash .title small { display:block; text-align:center; font-weight:600; font-size:calc(14px * var(--fs)); color:var(--muted); letter-spacing:0; }
@keyframes eyeOpen { from { transform:scaleY(.06); } }
@keyframes fadeUp { from { opacity:0; transform:translateY(6px); } }
@keyframes splashOut { to { opacity:0; visibility:hidden; } }

/* Homepage & glance */
.cards.three { display:grid; gap:10px; } .cards.three .card { margin:0; }
.split { display:grid; gap:20px; }
.glance { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
.glance .card { margin:0; padding:10px 12px; } .glance strong { display:block; font-size:calc(16px * var(--fs)); margin-top:2px; }
.glance .card.warn { background:var(--amber-soft); border-color:#F1DDA4; }
.navbrand, .navextra { display:none; }

/* Motion: small and quiet. Off for reduced-motion users. */
@keyframes rise { from { opacity:0; transform:translateY(8px); } }
@keyframes grow { from { width:0; } }
@keyframes blink { 0%, 94%, 100% { transform:scaleY(1); } 97% { transform:scaleY(.08); } }
@keyframes look { 0%, 40%, 100% { transform:translateX(0); } 55%, 70% { transform:translateX(9px); } 80% { transform:translateX(-6px); } }
@keyframes sheet { from { transform:translateY(24px); opacity:0; } }
main > *, .cards > *, .grid2 > *, .glance > *, .tl li { animation:rise .35s cubic-bezier(.2,.7,.3,1) both; }
main > *:nth-child(2) { animation-delay:.04s; } main > *:nth-child(3) { animation-delay:.08s; } main > *:nth-child(n+4) { animation-delay:.12s; }
.cards > *:nth-child(2), .grid2 > *:nth-child(2), .glance > *:nth-child(2), .tl li:nth-child(2) { animation-delay:.1s; }
.cards > *:nth-child(3), .grid2 > *:nth-child(3), .glance > *:nth-child(3), .tl li:nth-child(3) { animation-delay:.15s; }
.cards > *:nth-child(n+4), .grid2 > *:nth-child(n+4), .glance > *:nth-child(n+4), .tl li:nth-child(n+4) { animation-delay:.2s; }
.bar span { animation:grow .8s .2s cubic-bezier(.2,.7,.3,1) both; }
.hero .blink { transform-box:fill-box; transform-origin:center; animation:blink 6s infinite; }
.hero .iris { animation:look 9s ease-in-out infinite; }
.card, .linkrow, .btn, .back, nav.tabs a, .avatar { transition:transform .12s ease, background-color .15s, border-color .15s, box-shadow .15s; }
a.card:active, .linkrow:active, .btn:active, .back:active, nav.tabs a:active { transform:scale(.98); }
a.card:hover, .linkrow:hover { box-shadow:0 4px 14px rgba(11,31,51,.08); }
.chat:not([hidden]) { animation:sheet .25s cubic-bezier(.2,.7,.3,1); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } #splash { display:none; } }

/* Laptop */
@media (min-width:900px) {
  html, body { background:var(--page); }
  .phone { max-width:none; margin:0; border-radius:0; box-shadow:none; display:block; }
  main { padding:40px max(48px, calc((100% - 880px) / 2)) 64px; }
  body.inapp main { margin-left:232px; padding-left:max(48px, calc((100% - 880px) / 2)); padding-right:max(48px, calc((100% - 880px) / 2)); }
  body.inapp nav.tabs { position:fixed; top:0; bottom:0; left:0; right:auto; width:232px; display:flex; flex-direction:column; gap:4px; padding:24px 16px; border-top:0; border-right:1px solid var(--line); }
  nav.tabs a { text-align:left; padding:10px 16px; font-size:calc(16px * var(--fs)); }
  .navbrand { display:flex; flex-direction:column; gap:10px; margin:0 0 24px 8px; font-size:calc(16px * var(--fs)); line-height:1.25; }
  .navbrand .nhs { align-self:flex-start; }
  .navextra { display:block; margin-top:auto; }
  body.inapp .pagehead .nhs, body.inapp .pagehead .eyepill { display:none; }
  h1 { font-size:calc(32px * var(--fs)); }
  .cards { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .cards .card { margin:0; }
  .cards.three { grid-template-columns:repeat(3, 1fr); }
  .grid2 { grid-template-columns:repeat(4, 1fr); }
  .glance { grid-template-columns:repeat(4, 1fr); }
  .split { grid-template-columns:1.2fr 1fr; align-items:start; }
  .hero { margin:-40px calc(-1 * max(48px, (100vw - 880px) / 2)) 0; padding:48px max(48px, calc((100vw - 880px) / 2)) 0; display:grid; grid-template-columns:1fr 1fr; align-items:end; gap:24px; }
  .hero h1 { font-size:calc(48px * var(--fs)); } .hero .herotext { padding-bottom:64px; }
  .hero > svg { width:100%; height:300px; margin:0; }
  .hero::after { grid-column:1 / -1; margin:0 calc(-1 * max(48px, (100vw - 880px) / 2)); }
  .sheet { margin:0 calc(-1 * max(48px, (100vw - 880px) / 2)) -64px; padding:40px max(48px, calc((100vw - 880px) / 2)) 80px; border-radius:0; min-height:0; }
  .ask, .ask.noTabs { position:fixed; right:32px; bottom:32px; }
  .chat { position:fixed; inset:0 0 0 auto; width:400px; height:100vh; max-width:none; margin:0; border-radius:0; border-left:1px solid var(--line); }
  .sticky { background:none; } .sticky .btn { max-width:360px; }
}

/* Text size (user setting). Standard is already larger than before. */
html[data-text=large] { --fs:1.18; } html[data-text=xlarge] { --fs:1.36; }

/* High contrast (user setting) */
html[data-contrast=on] { --ink:#000; --muted:#1f1f1f; --line:#2b2b2b; --page:#fff; --card:#fff; --blue:#00458A; --blue-dark:#002D5C; --blue-soft:#E6EEF8; --blue-line:#00458A; --green:#0B4F22; --amber:#5A3B00; --red:#8A0F0F; }
html[data-contrast=on] body { background:#fff; }
html[data-contrast=on] .card, html[data-contrast=on] .linkrow, html[data-contrast=on] fieldset, html[data-contrast=on] input, html[data-contrast=on] select, html[data-contrast=on] textarea { border:2px solid #000; }
html[data-contrast=on] .tag { border:1.5px solid currentColor; }
html[data-contrast=on] a { text-decoration:underline; }
html[data-contrast=on] .btn, html[data-contrast=on] nav.tabs a, html[data-contrast=on] .card, html[data-contrast=on] a.card { text-decoration:none; }

/* Reduce motion (user setting; the system setting is honoured too) */
html[data-motion=on] *, html[data-motion=on] *::before, html[data-motion=on] *::after { animation:none !important; transition:none !important; }
html[data-motion=on] #splash { display:none; }

/* Voice off: no voice controls at all */
html[data-voice=off] .vq, html[data-voice=off] .voicebar, html[data-voice=off] .listenpage, html[data-voice=off] .chat form .mic { display:none !important; }

/* Amsler grid */
.btn.big { min-height:60px; font-size:calc(18px * var(--fs)); }
.checkcard { display:flex; gap:14px; align-items:center; }
.checkicon svg { display:block; border-radius:6px; border:1px solid var(--line); }
.checkhero { display:flex; gap:16px; align-items:center; } .checkhero svg { flex:none; border-radius:8px; border:1px solid var(--line); }
@media (max-width:360px) { .checkhero { flex-direction:column; align-items:stretch; } .checkhero svg { align-self:center; } }
.amsler { min-height:calc(100dvh - 32px); display:flex; flex-direction:column; gap:8px; }
.amsler h1 { font-size:calc(24px * var(--fs)); text-align:center; margin:4px 0 0; }
.amslertop { display:flex; align-items:center; gap:8px; } .amslertop .back { margin:0; } .amslertop .chipbtn { margin-left:auto; }
.amslerhint { text-align:center; margin:0; font-size:calc(16px * var(--fs)); }
.gridwrap { align-self:center; width:min(92vw, 56vh, 420px); aspect-ratio:1; }
.gridwrap svg { width:100%; height:100%; display:block; }
.gridwrap.marking { cursor:crosshair; outline:3px dashed var(--blue); outline-offset:4px; }
.amslerq { text-align:center; font-size:calc(16px * var(--fs)); margin:4px 0; }
.amslerbtns { display:flex; flex-direction:column; gap:8px; }
.amsler.dark { background:#000; color:#fff; margin:-16px -16px -104px; padding:16px 16px 40px; }
.amsler.dark .small, .amsler.dark .amslerhint { color:#ddd; } .amsler.dark .back, .amsler.dark .chipbtn { background:#111; color:#fff; border-color:#555; }
.markgrid svg { display:block; margin-top:8px; border:1px solid var(--line); }
.glance .card.green { background:var(--green-soft); }

/* Urgent help */
.urgentrow { border-left:6px solid var(--red); }
.helpcard h2 { margin:0 0 8px; } .helpcard.emergency { border:2px solid var(--red); }
.helpacts { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; } .helpacts .btn { flex:1 1 140px; }
.seg.four-nations { grid-template-columns:repeat(2, 1fr); border-radius:16px; gap:4px; }
.seg.four-nations button { border:0; background:transparent; border-radius:12px; padding:10px; font-weight:700; color:var(--muted); cursor:pointer; font-size:calc(14px * var(--fs)); }
.seg.four-nations button[aria-checked=true] { background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(11,31,51,.12); }

/* Settings controls */
.aa-btn { margin-left:auto; min-width:40px; height:40px; padding:0 10px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--ink); font-weight:800; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; font-size:calc(15px * var(--fs)); }
.aa-btn + .avatar { margin-left:8px; }
.switchrow { display:flex; align-items:center; gap:12px; } .switchrow > div { flex:1; } .switchrow h3 { margin:0 0 2px; } .switchrow p { margin:0; }
.switch { position:relative; width:56px; height:32px; flex:none; border-radius:999px; border:2px solid var(--muted); background:#fff; cursor:pointer; padding:0; }
.switch span { position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--muted); transition:left .15s; }
.switch[aria-checked=true] { background:var(--blue); border-color:var(--blue); }
.switch[aria-checked=true] span { left:27px; background:#fff; }
.sizes { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:10px; }
.sizes button, .speeds button { min-height:56px; border-radius:var(--r-sm); border:2px solid var(--line); background:#fff; color:var(--ink); font-weight:700; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:calc(13px * var(--fs)); padding:8px 4px; }
.sizes button[aria-checked=true], .speeds button[aria-checked=true] { border-color:var(--blue); background:var(--blue-soft); color:var(--blue-dark); box-shadow:inset 0 0 0 1px var(--blue); }
.aa { font-weight:800; line-height:1; } .aa-standard { font-size:18px; } .aa-large { font-size:24px; } .aa-xlarge { font-size:30px; }
.speeds { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; } .speeds button { min-height:48px; }

/* First-open prompt */
#firstrun { position:fixed; inset:0; z-index:60; background:rgba(11,31,51,.55); display:flex; align-items:flex-end; justify-content:center; }
@media (min-width:600px) { #firstrun { align-items:center; } }
.frcard { background:var(--page); width:100%; max-width:460px; max-height:100%; overflow-y:auto; border-radius:24px 24px 0 0; padding:24px 20px calc(20px + env(safe-area-inset-bottom)); animation:sheet .3s cubic-bezier(.2,.7,.3,1); }
@media (min-width:600px) { .frcard { border-radius:24px; } }
.frcard h2 { display:block; font-size:calc(24px * var(--fs)); line-height:1.25; margin:8px 0 10px; }
.frcard p { font-size:calc(17px * var(--fs)); }
.frcard .btn.big { min-height:60px; font-size:calc(18px * var(--fs)); margin-top:10px; }
.fricon { display:flex; justify-content:center; }

#firstrun .frfull { position:fixed; inset:0; background:#fff; color:#000; display:flex; flex-direction:column; justify-content:center; gap:3vh;
  padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom)); overflow-y:auto; }
#firstrun .frfull h2 { display:block; margin:0 0 1vh; font-size:clamp(32px, 8.5vw, 56px); line-height:1.15; font-weight:800; letter-spacing:-.5px; color:#000; text-align:center; }
.frbig { width:100%; min-height:max(18vh, 96px); border-radius:22px; font:800 clamp(40px, 12vw, 72px)/1 'Plus Jakarta Sans', system-ui, sans-serif; letter-spacing:.04em; cursor:pointer; }
.frbig.yes { background:#003087; color:#fff; border:4px solid #003087; }
.frbig.no { background:#fff; color:#000; border:5px solid #000; }
.frbig:focus-visible { outline:6px solid #FFB81C; outline-offset:4px; }
#firstrun .frfull .sizes { grid-template-columns:1fr; gap:10px; }
#firstrun .frfull .sizes button { min-height:12vh; flex-direction:row; gap:16px; font-size:clamp(20px, 5.5vw, 30px); border-width:3px; border-color:#000; color:#000; }
#firstrun .frfull .sizes button[aria-checked=true] { border-color:#003087; background:#E6EEF8; box-shadow:inset 0 0 0 3px #003087; }
#firstrun .frfull .aa-standard { font-size:28px; } #firstrun .frfull .aa-large { font-size:36px; } #firstrun .frfull .aa-xlarge { font-size:46px; }
#firstrun .frfull .switchrow { border:3px solid #000; } #firstrun .frfull .switchrow h3 { font-size:clamp(20px, 5.5vw, 28px); color:#000; }
#firstrun .frfull .switch { width:72px; height:40px; } #firstrun .frfull .switch span { width:30px; height:30px; } #firstrun .frfull .switch[aria-checked=true] span { left:35px; }

/* Speaking bar: always reachable Stop; the page moves down to make room for it */
body.barred main { padding-top:calc(84px + env(safe-area-inset-top)); }
@media (min-width:900px) { body.barred main { padding-top:104px; } }
#speakbar { white-space:nowrap; position:fixed; left:50%; top:calc(12px + env(safe-area-inset-top)); transform:translateX(-50%); z-index:70; display:flex; align-items:center; gap:12px; padding:8px 8px 8px 18px; border-radius:999px; background:var(--ink); color:#fff; font-weight:700; font-size:calc(16px * var(--fs)); box-shadow:0 8px 24px rgba(11,31,51,.3); max-width:calc(100% - 24px); }
#speakbar button { min-height:48px; min-width:88px; border-radius:999px; border:0; background:#fff; color:var(--ink); font-weight:800; font-size:calc(16px * var(--fs)); cursor:pointer; }
</style>
</head>
<body>
<div id="speakbar" role="status" hidden><span>Reading aloud</span><button type="button">Stop</button></div>
<div id="splash" aria-hidden="true">
  <svg viewBox="-90 -50 180 100"><g class="lid">
    <path d="M-82 0 Q0 -58 82 0 Q0 58 -82 0Z" fill="#fff" stroke="#0B1F33" stroke-width="5" stroke-linejoin="round"/>
    <circle r="30" fill="#2F7BD0"/><circle r="30" fill="none" stroke="#003D78" stroke-width="3"/><circle r="15" fill="#0B1F33"/><circle cx="10" cy="-10" r="6" fill="#fff"/></g></svg>
  <div class="title">Clear Sight Companion<small>Your personal eye health assistant</small></div>
</div>
<div class="phone">
  <main id="view" tabindex="-1"></main>
  <nav class="tabs" id="tabs" hidden aria-label="Main">
    <div class="navbrand"><span class="nhs">NHS</span><strong>Clear Sight<br>Companion</strong></div>
    <a href="#home">Home</a><a href="#foryou">For you</a><a href="#nearby">Nearby</a><a href="#records">Records</a><a href="#learn">Learn</a>
    <a href="#profile" class="navextra">Profile</a>
  </nav>
  <button class="ask" id="askBtn" aria-expanded="false" aria-controls="chat">Ask</button>

    <header><strong>Assistant<small>Help finding your way, and NHS information. Not medical advice.</small></strong><button class="iconbtn" id="chatClose" aria-label="Close assistant">✕</button></header>
    <div class="log" id="log" aria-live="polite"></div>
    <form id="chatForm"><input id="chatIn" aria-label="Message" type="text" autocomplete="off" placeholder="Ask about the app or a topic"><button>Send</button></form>
  </section>
</div>
<script src="rules.js"></script>
<script src="chat.js"></script>
<script src="nearby.js"></script>
<script src="files.js"></script>
<script src="rxscan.js"></script>
<script src="voice.js"></script>
<script src="app.js"></script>
<script>setTimeout(() => document.getElementById("splash")?.remove(), 2500);</script>
</body>
</html>
